name: Release Sleep Launcher

# Para lançar uma versão: muda "version" em src-tauri/tauri.conf.json e src-tauri/Cargo.toml, faz commit e
#   git tag v0.2.0 && git push --tags
# Compila Windows, macOS (Apple Silicon + Intel) e Linux, assina as atualizações (updater) e publica tudo na Release,
# As mods do Sleep NÃO passam por aqui: o CI do client publica-as sozinho (ver mods.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux - dependências do Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KUBO_CF_KEY: ${{ secrets.KUBO_CF_KEY }}
          KUBO_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sleep Launcher ${{ github.ref_name }}
          releaseBody: Instala o ficheiro do teu sistema. Quem já tem o launcher recebe esta versão sozinho.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
